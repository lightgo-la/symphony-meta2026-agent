[package]
name = "prompt_canvas_gui"
version = "0.1.0"
edition = "2021"
description = "노드식 다중 프롬프트 캔버스 데스크톱 앱 (Meta Muse API + MCP 지원)"
license = "MIT"
repository = "https://github.com/lightgo-la/symphony-meta2026-agent"
authors = ["Prompt Canvas Contributors"]

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5.4.5"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
# Fast iteration: shorter link times, keep incremental compilation.
debug = 1
incremental = true

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.fast]
# Optimization measurement: release-grade optimization, fast build without LTO.
# cargo run --profile fast
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false
debug = 1

[build-dependencies]
winresource = "0.1.34"
